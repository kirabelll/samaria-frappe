[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "samaria"
authors = [
    { name = "Samaria ERP Team", email = "info@samariaerp.com" }
]
description = "Samaria ERP - Specialized Construction, Cement, Aggregate, Medical and Transporter Operations for Frappe v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed in bench environment
]

[project.urls]
Homepage = "https://github.com/kirabelll/samaria-frappe"
Repository = "https://github.com/kirabelll/samaria-frappe.git"

[tool.flit.sdist]
exclude = [
    ".git*",
    "**/__pycache__",
    "node_modules",
    "*.pyc"
]
